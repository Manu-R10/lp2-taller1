
{% extends "base.html" %}

{% block titulo %}{{ producto.nombre }} - Tienda Virtual{% endblock %}

{% block contenido %}
<div class="detalle-producto">
    <img
        src="{{ url_for('static', filename=producto.foto) }}"
        alt="{{ producto.nombre }}"
    >

    <h2>{{ producto.nombre }}</h2>
    <p><strong>Marca:</strong> {{ producto.marca }}</p>
    <p><strong>SKU:</strong> {{ producto.sku }}</p>
    <p><strong>Precio:</strong> ${{ "{:,.0f}".format(producto.precio) }}</p>

    <p>
        <a href="{{ url_for('main.index') }}">&larr; Volver al catálogo</a>
    </p>
</div>
{% endblock %}
